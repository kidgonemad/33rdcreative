<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUCKI - 33rd Creative</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(10, 10, 10, 0.9) 0%, transparent 100%);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 8px;
            color: #5f27cd;
            text-transform: uppercase;
        }

        .back-link {
            font-size: 12px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #5f27cd;
        }

        /* Grid Container */
        .grid-container {
            padding: 120px 40px 60px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        /* Grid Item */
        .grid-item {
            position: relative;
            aspect-ratio: 16/9;
            overflow: hidden;
            border-radius: 6px;
            background: #151515;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s;
        }

        .grid-item:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 50px rgba(95, 39, 205, 0.2);
            z-index: 10;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }

        .grid-item:hover img {
            transform: scale(1.08);
        }

        .grid-item::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.6) 0%, transparent 40%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .grid-item:hover::after {
            opacity: 1;
        }

        .grid-item .item-title {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.85);
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.3s, transform 0.3s;
            z-index: 2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .grid-item:hover .item-title {
            opacity: 1;
            transform: translateY(0);
        }

        .grid-item.loading {
            background: linear-gradient(90deg, #151515 25%, #1a1a1a 50%, #151515 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        /* Counter */
        .counter {
            position: fixed;
            bottom: 25px;
            right: 40px;
            font-size: 11px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.25);
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.3s, transform 0.3s;
        }

        .lightbox.active img {
            opacity: 1;
            transform: scale(1);
        }

        /* Glow effect */
        .glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(95, 39, 205, 0.15) 0%, transparent 70%);
            pointer-events: none;
            left: 50%;
            top: 30%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }
    </style>
</head>

<body>
    <div class="glow"></div>

    <header class="header">
        <div class="logo">LUCKI</div>
        <a href="../index.html" class="back-link">← Back</a>
    </header>

    <div class="grid-container">
        <div class="grid" id="grid">
            <!-- Images will be loaded dynamically -->
        </div>
    </div>

    <div class="counter" id="counter"></div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <img src="" alt="" id="lightboxImg">
    </div>

    <script>
        // List of images in the lucki folder
        const images = [
            'Recording 2025-04-10 183355.gif',
            'Recording 2025-04-11 013513.gif',
            'Recording 2025-04-11 0137513.gif',
            'Recording 2025-04-e11 013513.gif',
            'Recording 72025-04-11 013513.gif',
            'Untitled video - Made with Clipchamp (38).gif',
            'Untitled video - Made with Clipchamp (39).gif',
            'Untitled video - Made with Clipchamp (40).gif',
            'Untitled video - Made with Clipchamp (41).gif',
            'Untitled video - Made with Clipchamp (42).gif',
            'Untitled video - Made with Clipchamp (44).gif',
            'Untitled video - Made with Clipchamp (45).gif',
            'Untitled video - Made with Clipchamp (46).gif',
            'lucki-clip-2026.gif'
        ];

        const grid = document.getElementById('grid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const counter = document.getElementById('counter');

        // Update counter
        counter.textContent = `${images.length} ITEMS`;

        // Create grid items
        images.forEach((filename, index) => {
            const item = document.createElement('div');
            item.className = 'grid-item loading';

            // Create display name
            let displayName = filename
                .replace('.gif', '')
                .replace('Untitled video - Made with Clipchamp ', 'Clip ')
                .replace('Recording ', 'Rec ');

            item.innerHTML = `
                <img src="../lucki/${encodeURIComponent(filename)}" alt="${displayName}" loading="lazy">
                <span class="item-title">${displayName}</span>
            `;

            const img = item.querySelector('img');
            img.onload = () => item.classList.remove('loading');
            img.onerror = () => { item.style.display = 'none'; };

            item.addEventListener('click', () => {
                lightboxImg.src = `../lucki/${encodeURIComponent(filename)}`;
                lightbox.classList.add('active');
            });

            grid.appendChild(item);
        });

        // Close lightbox
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (lightbox.classList.contains('active')) {
                    closeLightbox();
                } else {
                    window.location.href = '../index.html';
                }
            }
        });

        function closeLightbox() {
            lightbox.classList.remove('active');
        }
    </script>
</body>

</html>
