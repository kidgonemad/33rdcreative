<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D GLB Viewer with God Rays</title>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "postprocessing": "https://unpkg.com/postprocessing@6.35.2/build/index.js"
        }
    }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            overflow: hidden; 
            font-family: system-ui, -apple-system, sans-serif;
        }
        #container { width: 100vw; height: 100vh; position: relative; }
        
        #upload-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 300;
        }
        
        #upload-screen h1 {
            color: white;
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }
        
        #upload-screen p {
            color: #888;
            margin-bottom: 30px;
        }
        
        #drop-zone {
            width: 400px;
            height: 200px;
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        #drop-zone:hover, #drop-zone.dragover {
            border-color: white;
            background: rgba(255,255,255,0.05);
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
        }
        
        #drop-zone svg {
            width: 60px;
            height: 60px;
            fill: rgba(255,255,255,0.5);
            margin-bottom: 15px;
        }
        
        #drop-zone span {
            color: white;
            font-size: 16px;
        }
        
        #drop-zone small {
            color: #666;
            margin-top: 10px;
        }
        
        #file-input { display: none; }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90%;
        }
        
        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            white-space: nowrap;
        }
        
        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .btn.active {
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 200;
            text-align: center;
            display: none;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #new-file-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }
        
        #parts-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 15px;
            max-height: 70vh;
            overflow-y: auto;
            z-index: 100;
            min-width: 220px;
            max-width: 300px;
            display: none;
            backdrop-filter: blur(10px);
        }
        
        #parts-panel h3 {
            color: white;
            font-size: 14px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        
        .part-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .part-item:last-child {
            border-bottom: none;
        }
        
        .part-item label {
            color: #ddd;
            font-size: 12px;
            cursor: pointer;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .part-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #00aaff;
        }
        
        .strobe-btn {
            background: rgba(255, 200, 0, 0.1);
            border: 1px solid rgba(255, 200, 0, 0.3);
            color: #ffcc00;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            transition: all 0.2s;
        }
        
        .strobe-btn:hover {
            background: rgba(255, 200, 0, 0.2);
        }
        
        .strobe-btn.active {
            background: rgba(255, 200, 0, 0.4);
            border-color: #ffcc00;
            box-shadow: 0 0 8px rgba(255, 200, 0, 0.5);
        }
        
        #strobe-target-info {
            color: #888;
            font-size: 11px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        #strobe-target-info span {
            color: #ffcc00;
        }
        
        .part-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .part-actions button {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
        }
        
        .part-actions button:hover {
            background: rgba(255,255,255,0.2);
        }
        
        #parts-panel::-webkit-scrollbar {
            width: 6px;
        }
        
        #parts-panel::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }
        
        #parts-panel::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
        }
        
        #godrays-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 15px 20px;
            z-index: 100;
            min-width: 320px;
            display: none;
            backdrop-filter: blur(10px);
        }
        
        #godrays-panel h3 {
            color: white;
            font-size: 14px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        
        .slider-group {
            margin-bottom: 12px;
        }
        
        .slider-group label {
            color: #ddd;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .slider-group input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        
        .slider-row {
            display: flex;
            gap: 10px;
        }
        
        .slider-row .slider-group {
            flex: 1;
        }
        
        .save-btn {
            background: rgba(0, 200, 100, 0.2) !important;
            border: 1px solid rgba(0, 200, 100, 0.5) !important;
            color: #00ff88 !important;
        }
        
        .save-btn:hover {
            background: rgba(0, 200, 100, 0.3) !important;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="upload-screen">
            <h1>✨ God Rays Viewer</h1>
            <p>Upload your 3D model to view with volumetric light rays</p>
            <div id="drop-zone">
                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                <span>Drop GLB file here or click to upload</span>
                <small>.glb files only</small>
            </div>
            <input type="file" id="file-input" accept=".glb">
        </div>
        
        <div id="loading">
            <div class="spinner"></div>
            <div>Loading model...</div>
        </div>
        
        <button class="btn" id="new-file-btn" style="display: none;">↑ Load New File</button>
        
        <div id="parts-panel">
            <h3>📦 Model Parts</h3>
            <div class="part-actions">
                <button id="show-all-parts">Show All</button>
                <button id="hide-all-parts">Hide All</button>
            </div>
            <div id="parts-list"></div>
            <div id="strobe-target-info">☀️ Rays source: <span id="strobe-target-name">Plane024</span></div>
            <button id="clear-strobe-target" class="btn" style="width: 100%; margin-top: 8px; font-size: 11px; padding: 6px;">Use Sphere Light</button>
        </div>
        
        <div id="godrays-panel">
            <h3>☀️ God Rays Settings</h3>
            <div class="slider-group">
                <label>Density: <span id="density-value">1.0</span></label>
                <input type="range" id="density-slider" min="0" max="200" value="100">
            </div>
            <div class="slider-group">
                <label>Weight: <span id="weight-value">0.5</span></label>
                <input type="range" id="weight-slider" min="0" max="100" value="50">
            </div>
            <div class="slider-group">
                <label>Decay: <span id="decay-value">0.9</span></label>
                <input type="range" id="decay-slider" min="50" max="100" value="90">
            </div>
            <div class="slider-group">
                <label>Exposure: <span id="exposure-value">0.3</span></label>
                <input type="range" id="exposure-slider" min="0" max="100" value="30">
            </div>
            <div class="slider-group">
                <label>Samples: <span id="samples-value">20</span></label>
                <input type="range" id="samples-slider" min="10" max="60" value="20">
            </div>
            <h4 style="color: #aaa; font-size: 12px; margin: 15px 0 10px;">Light Position</h4>
            <div class="slider-row">
                <div class="slider-group">
                    <label>X: <span id="light-x-value">0</span></label>
                    <input type="range" id="light-x-slider" min="-100" max="100" value="0">
                </div>
                <div class="slider-group">
                    <label>Y: <span id="light-y-value">0</span></label>
                    <input type="range" id="light-y-slider" min="-100" max="100" value="0">
                </div>
            </div>
            <div class="slider-group">
                <label>Z: <span id="light-z-value">-50</span></label>
                <input type="range" id="light-z-slider" min="-100" max="50" value="-50">
            </div>
            <div class="slider-group">
                <label>Light Size: <span id="light-size-value">100</span>%</label>
                <input type="range" id="light-size-slider" min="10" max="300" value="100">
            </div>
            <button id="reset-godrays-btn" class="btn" style="width: 100%; margin-top: 10px; font-size: 11px;">Reset Settings</button>
        </div>
        
        <div id="resize-panel" style="display: none; position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 15px 20px; z-index: 100; backdrop-filter: blur(10px);">
            <div style="color: white; font-size: 12px; margin-bottom: 10px;">Model Scale: <span id="scale-value">100</span>%</div>
            <input type="range" id="scale-slider" min="10" max="300" value="100" style="width: 200px; cursor: pointer;">
        </div>
        
        <div id="controls" style="display: none;">
            <button class="btn active" id="godrays-toggle">☀️ God Rays: ON</button>
            <button class="btn" id="animate-toggle">🔄 Animate: OFF</button>
            <button class="btn" id="color-btn">🎨 White</button>
            <button class="btn active" id="rotate-toggle">🔄 Auto-Rotate: ON</button>
            <button class="btn" id="parts-toggle">📦 Parts Panel</button>
            <button class="btn" id="godrays-settings-btn">⚙️ Rays Settings</button>
            <button class="btn" id="resize-toggle">📐 Resize</button>
            <button class="btn save-btn" id="save-toggle">💾 Save</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { EffectComposer, EffectPass, GodRaysEffect, RenderPass } from 'postprocessing';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(0, 2, 15);

        const renderer = new THREE.WebGLRenderer({
            powerPreference: "high-performance",
            antialias: false,
            stencil: false,
            depth: false,
            preserveDrawingBuffer: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('container').appendChild(renderer.domElement);

        // Orbit controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1;

        // Light source mesh for God Rays
        const lightGeometry = new THREE.SphereGeometry(2, 32, 32);
        const lightMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                color: { value: new THREE.Color(0xffffff) }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform vec3 color;
                varying vec2 vUv;
                void main() {
                    float dist = distance(vUv, vec2(0.5));
                    float pulse = 0.8 + 0.2 * sin(time * 3.0);
                    float intensity = smoothstep(0.5, 0.0, dist) * pulse;
                    gl_FragColor = vec4(color * intensity, intensity);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending
        });
        
        const lightSource = new THREE.Mesh(lightGeometry, lightMaterial);
        lightSource.position.set(0, 0, -10);
        lightSource.userData.time = lightMaterial.uniforms.time;
        lightSource.userData.color = lightMaterial.uniforms.color;
        lightSource.visible = false; // Hidden by default, Plane024 will be used
        scene.add(lightSource);

        // Ambient light
        scene.add(new THREE.AmbientLight(0x222222));

        // Point light for model illumination
        const pointLight = new THREE.PointLight(0xffffff, 1, 50);
        pointLight.position.set(0, 5, 5);
        scene.add(pointLight);

        // Post-processing with God Rays
        let composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        
        let godRaysSettings = {
            density: 1,
            weight: 0.5,
            decay: 0.9,
            exposure: 0.3,
            samples: 20
        };
        
        let godRaysEffect = new GodRaysEffect(camera, lightSource, {
            height: 480,
            kernelSize: 2,
            density: godRaysSettings.density,
            decay: godRaysSettings.decay,
            weight: godRaysSettings.weight,
            exposure: godRaysSettings.exposure,
            samples: godRaysSettings.samples,
            clampMax: 0.95
        });
        
        let effectPass = new EffectPass(camera, godRaysEffect);
        composer.addPass(effectPass);

        let godRaysEnabled = true;
        let animateLight = false;
        let colorMode = 0;

        // Model loading
        let model = null;
        let modelParts = [];
        let baseScale = 1;
        let raySourceMesh = null;
        let raySourceName = 'Light';
        const loader = new GLTFLoader();

        function rebuildGodRays() {
            // Remove old effect pass
            composer.removePass(effectPass);
            
            // Create new effect with current light source
            const targetMesh = raySourceMesh || lightSource;
            
            godRaysEffect = new GodRaysEffect(camera, targetMesh, {
                height: 480,
                kernelSize: 2,
                density: godRaysSettings.density,
                decay: godRaysSettings.decay,
                weight: godRaysSettings.weight,
                exposure: godRaysSettings.exposure,
                samples: godRaysSettings.samples,
                clampMax: 0.95
            });
            
            effectPass = new EffectPass(camera, godRaysEffect);
            effectPass.enabled = godRaysEnabled;
            composer.addPass(effectPass);
        }

        function buildPartsList() {
            modelParts = [];
            const partsList = document.getElementById('parts-list');
            partsList.innerHTML = '';
            raySourceMesh = null;
            raySourceName = 'Plane024';
            document.getElementById('strobe-target-name').textContent = 'Searching...';
            
            if (!model) return;
            
            let partIndex = 0;
            model.traverse((child) => {
                if (child.isMesh) {
                    const partName = child.name || `Part ${partIndex + 1}`;
                    modelParts.push({ mesh: child, name: partName });
                    
                    // Hide Cube011 by default
                    if (child.name === 'Cube011') {
                        child.visible = false;
                    }
                    
                    // Use Plane024 as the ray source
                    if (child.name === 'Plane024') {
                        // Make it emissive so it glows
                        if (child.material) {
                            child.material = child.material.clone();
                            child.material.emissive = new THREE.Color(0xffffff);
                            child.material.emissiveIntensity = 2;
                        }
                        raySourceMesh = child;
                        raySourceName = 'Plane024';
                        document.getElementById('strobe-target-name').textContent = raySourceName;
                        // Hide the default sphere light
                        lightSource.visible = false;
                    }
                    
                    const item = document.createElement('div');
                    item.className = 'part-item';
                    
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = child.visible;
                    checkbox.id = `part-${partIndex}`;
                    checkbox.addEventListener('change', (e) => {
                        child.visible = e.target.checked;
                    });
                    
                    const label = document.createElement('label');
                    label.htmlFor = `part-${partIndex}`;
                    label.textContent = partName;
                    label.title = partName;
                    
                    const rayBtn = document.createElement('button');
                    rayBtn.className = 'strobe-btn';
                    if (child.name === 'Plane024') {
                        rayBtn.classList.add('active');
                    }
                    rayBtn.textContent = '☀️';
                    rayBtn.title = 'Set as ray source';
                    rayBtn.dataset.partIndex = partIndex;
                    rayBtn.addEventListener('click', (e) => {
                        document.querySelectorAll('.strobe-btn').forEach(btn => btn.classList.remove('active'));
                        
                        // Reset previous source
                        modelParts.forEach(p => {
                            if (p.mesh.material && p.mesh !== child) {
                                p.mesh.material.emissiveIntensity = 0.2;
                            }
                        });
                        
                        // Make the mesh emissive so it works as a light source
                        if (child.material) {
                            child.material = child.material.clone();
                            child.material.emissive = new THREE.Color(0xffffff);
                            child.material.emissiveIntensity = 2;
                        }
                        
                        raySourceMesh = child;
                        raySourceName = partName;
                        document.getElementById('strobe-target-name').textContent = partName;
                        rayBtn.classList.add('active');
                        lightSource.visible = false;
                        
                        rebuildGodRays();
                    });
                    
                    item.appendChild(checkbox);
                    item.appendChild(label);
                    item.appendChild(rayBtn);
                    partsList.appendChild(item);
                    
                    partIndex++;
                }
            });
            
            if (modelParts.length === 0) {
                partsList.innerHTML = '<div style="color: #888; font-size: 12px;">No parts found</div>';
            }
            
            // If Plane024 wasn't found, show the sphere light
            if (!raySourceMesh) {
                lightSource.visible = true;
                raySourceName = 'Light (Sphere)';
                document.getElementById('strobe-target-name').textContent = raySourceName;
            }
        }

        function loadModel(url) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('upload-screen').style.display = 'none';
            
            document.getElementById('scale-slider').value = 100;
            document.getElementById('scale-value').textContent = '100';
            raySourceMesh = null;
            raySourceName = 'Plane024';
            lightSource.visible = false;
            
            if (model) scene.remove(model);

            loader.load(url,
                (gltf) => {
                    model = gltf.scene;
                    
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 6 / maxDim;
                    model.scale.multiplyScalar(scale);
                    baseScale = scale;
                    model.position.sub(center.multiplyScalar(scale));
                    
                    model.traverse((child) => {
                        if (child.isMesh && child.material) {
                            child.material.emissive = new THREE.Color(0x111111);
                            child.material.emissiveIntensity = 0.2;
                        }
                    });
                    
                    scene.add(model);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('controls').style.display = 'flex';
                    document.getElementById('new-file-btn').style.display = 'block';
                    
                    buildPartsList();
                    rebuildGodRays();
                },
                undefined,
                (error) => {
                    console.error('Error:', error);
                    document.getElementById('loading').innerHTML = '<div style="color:#f44">Error loading model</div>';
                }
            );
        }

        // File handling
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.glb')) {
                loadModel(URL.createObjectURL(file));
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadModel(URL.createObjectURL(file));
        });

        document.getElementById('new-file-btn').addEventListener('click', () => {
            document.getElementById('upload-screen').style.display = 'flex';
            document.getElementById('controls').style.display = 'none';
            document.getElementById('new-file-btn').style.display = 'none';
            document.getElementById('parts-panel').style.display = 'none';
            document.getElementById('resize-panel').style.display = 'none';
            document.getElementById('godrays-panel').style.display = 'none';
        });

        // Controls
        document.getElementById('godrays-toggle').addEventListener('click', function() {
            godRaysEnabled = !godRaysEnabled;
            effectPass.enabled = godRaysEnabled;
            this.textContent = `☀️ God Rays: ${godRaysEnabled ? 'ON' : 'OFF'}`;
            this.classList.toggle('active', godRaysEnabled);
        });

        document.getElementById('animate-toggle').addEventListener('click', function() {
            animateLight = !animateLight;
            this.textContent = `🔄 Animate: ${animateLight ? 'ON' : 'OFF'}`;
            this.classList.toggle('active', animateLight);
        });

        const colorModes = ['White', 'Gold', 'Cyan', 'Magenta', 'Rainbow'];
        const colorValues = [0xffffff, 0xffaa00, 0x00ffff, 0xff00ff, null];
        document.getElementById('color-btn').addEventListener('click', function() {
            colorMode = (colorMode + 1) % colorModes.length;
            this.textContent = `🎨 ${colorModes[colorMode]}`;
        });

        document.getElementById('rotate-toggle').addEventListener('click', function() {
            controls.autoRotate = !controls.autoRotate;
            this.textContent = `🔄 Auto-Rotate: ${controls.autoRotate ? 'ON' : 'OFF'}`;
            this.classList.toggle('active', controls.autoRotate);
        });

        document.getElementById('parts-toggle').addEventListener('click', function() {
            const panel = document.getElementById('parts-panel');
            const isVisible = panel.style.display === 'block';
            panel.style.display = isVisible ? 'none' : 'block';
            this.classList.toggle('active', !isVisible);
        });

        document.getElementById('show-all-parts').addEventListener('click', () => {
            modelParts.forEach((part, i) => {
                part.mesh.visible = true;
                document.getElementById(`part-${i}`).checked = true;
            });
        });

        document.getElementById('hide-all-parts').addEventListener('click', () => {
            modelParts.forEach((part, i) => {
                part.mesh.visible = false;
                document.getElementById(`part-${i}`).checked = false;
            });
        });

        document.getElementById('clear-strobe-target').addEventListener('click', () => {
            // Reset all materials
            modelParts.forEach(p => {
                if (p.mesh.material) {
                    p.mesh.material.emissiveIntensity = 0.2;
                }
            });
            
            raySourceMesh = null;
            raySourceName = 'Light';
            document.getElementById('strobe-target-name').textContent = raySourceName;
            document.querySelectorAll('.strobe-btn').forEach(btn => btn.classList.remove('active'));
            lightSource.visible = true;
            rebuildGodRays();
        });

        document.getElementById('godrays-settings-btn').addEventListener('click', function() {
            const panel = document.getElementById('godrays-panel');
            const isVisible = panel.style.display === 'block';
            panel.style.display = isVisible ? 'none' : 'block';
            this.classList.toggle('active', !isVisible);
        });

        // God Rays settings sliders
        document.getElementById('density-slider').addEventListener('input', function() {
            godRaysSettings.density = this.value / 100;
            document.getElementById('density-value').textContent = godRaysSettings.density.toFixed(1);
            rebuildGodRays();
        });

        document.getElementById('weight-slider').addEventListener('input', function() {
            godRaysSettings.weight = this.value / 100;
            document.getElementById('weight-value').textContent = godRaysSettings.weight.toFixed(2);
            rebuildGodRays();
        });

        document.getElementById('decay-slider').addEventListener('input', function() {
            godRaysSettings.decay = this.value / 100;
            document.getElementById('decay-value').textContent = godRaysSettings.decay.toFixed(2);
            rebuildGodRays();
        });

        document.getElementById('exposure-slider').addEventListener('input', function() {
            godRaysSettings.exposure = this.value / 100;
            document.getElementById('exposure-value').textContent = godRaysSettings.exposure.toFixed(2);
            rebuildGodRays();
        });

        document.getElementById('samples-slider').addEventListener('input', function() {
            godRaysSettings.samples = parseInt(this.value);
            document.getElementById('samples-value').textContent = godRaysSettings.samples;
            rebuildGodRays();
        });

        // Light position sliders
        document.getElementById('light-x-slider').addEventListener('input', function() {
            lightSource.position.x = this.value / 10;
            document.getElementById('light-x-value').textContent = this.value;
        });

        document.getElementById('light-y-slider').addEventListener('input', function() {
            lightSource.position.y = this.value / 10;
            document.getElementById('light-y-value').textContent = this.value;
        });

        document.getElementById('light-z-slider').addEventListener('input', function() {
            lightSource.position.z = this.value / 10;
            document.getElementById('light-z-value').textContent = this.value;
        });

        document.getElementById('light-size-slider').addEventListener('input', function() {
            const scale = this.value / 100;
            lightSource.scale.set(scale, scale, scale);
            document.getElementById('light-size-value').textContent = this.value;
        });

        document.getElementById('reset-godrays-btn').addEventListener('click', () => {
            godRaysSettings = { density: 1, weight: 0.5, decay: 0.9, exposure: 0.3, samples: 20 };
            
            document.getElementById('density-slider').value = 100;
            document.getElementById('density-value').textContent = '1.0';
            document.getElementById('weight-slider').value = 50;
            document.getElementById('weight-value').textContent = '0.5';
            document.getElementById('decay-slider').value = 90;
            document.getElementById('decay-value').textContent = '0.9';
            document.getElementById('exposure-slider').value = 30;
            document.getElementById('exposure-value').textContent = '0.3';
            document.getElementById('samples-slider').value = 20;
            document.getElementById('samples-value').textContent = '20';
            
            document.getElementById('light-x-slider').value = 0;
            document.getElementById('light-x-value').textContent = '0';
            document.getElementById('light-y-slider').value = 0;
            document.getElementById('light-y-value').textContent = '0';
            document.getElementById('light-z-slider').value = -50;
            document.getElementById('light-z-value').textContent = '-50';
            document.getElementById('light-size-slider').value = 100;
            document.getElementById('light-size-value').textContent = '100';
            
            lightSource.position.set(0, 0, -5);
            lightSource.scale.set(1, 1, 1);
            
            rebuildGodRays();
        });

        document.getElementById('resize-toggle').addEventListener('click', function() {
            const panel = document.getElementById('resize-panel');
            const isVisible = panel.style.display === 'block';
            panel.style.display = isVisible ? 'none' : 'block';
            this.classList.toggle('active', !isVisible);
        });

        document.getElementById('scale-slider').addEventListener('input', function() {
            const scalePercent = parseInt(this.value);
            document.getElementById('scale-value').textContent = scalePercent;
            if (model) {
                const newScale = baseScale * (scalePercent / 100);
                model.scale.set(newScale, newScale, newScale);
            }
        });

        // Save functionality
        document.getElementById('save-toggle').addEventListener('click', () => {
            const controlsEl = document.getElementById('controls');
            const newFileBtn = document.getElementById('new-file-btn');
            const partsPanel = document.getElementById('parts-panel');
            const resizePanel = document.getElementById('resize-panel');
            const godraysPanel = document.getElementById('godrays-panel');
            
            controlsEl.style.display = 'none';
            newFileBtn.style.display = 'none';
            partsPanel.style.display = 'none';
            resizePanel.style.display = 'none';
            godraysPanel.style.display = 'none';
            
            composer.render();
            
            const link = document.createElement('a');
            link.download = 'godrays-render-' + Date.now() + '.png';
            link.href = renderer.domElement.toDataURL('image/png');
            link.click();
            
            controlsEl.style.display = 'flex';
            newFileBtn.style.display = 'block';
        });

        // Animation
        const clock = new THREE.Clock();

        function getColor(t) {
            if (colorMode === 4) { // Rainbow
                return new THREE.Color().setHSL((t * 0.1) % 1, 1, 0.5);
            }
            return new THREE.Color(colorValues[colorMode]);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const t = clock.getElapsedTime();
            
            // Update light shader time
            lightSource.userData.time.value = t;
            
            // Update light color
            const currentColor = getColor(t);
            lightSource.userData.color.value = currentColor;
            
            // Update ray source mesh color if set
            if (raySourceMesh && raySourceMesh.material) {
                raySourceMesh.material.emissive = currentColor;
            }
            
            // Animate light position if enabled
            if (animateLight && !raySourceMesh) {
                lightSource.position.x = Math.cos(t) * 4;
                lightSource.position.y = Math.sin(t * 0.6) * 4;
            }
            
            controls.update();
            composer.render();
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
