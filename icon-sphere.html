<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Icon Rings</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #f5f5f5;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: grab;
    }

    body:active {
      cursor: grabbing;
    }

    .scene {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 800px;
    }

    .container {
      position: relative;
      width: 600px;
      height: 600px;
      transform-style: preserve-3d;
      transform: rotateX(-10deg);
    }

    .icon-item {
      position: absolute;
      width: 50px;
      height: 50px;
      left: 50%;
      top: 50%;
      margin-left: -25px;
      margin-top: -25px;
      cursor: pointer;
    }

    .icon-item:hover .icon-inner {
      transform: scale(1.5);
      filter: brightness(2);
    }

    .icon-inner {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(80, 80, 80, 0.85);
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .icon-inner svg {
      width: 40px;
      height: 40px;
      fill: currentColor;
    }

    /* Toggle button */
    .toggle-mode {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 28px;
      z-index: 100;
      opacity: 0.4;
      transition: opacity 0.3s;
    }

    .toggle-mode:hover {
      opacity: 0.7;
    }

    .mode-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mode-btn svg {
      width: 20px;
      height: 20px;
      fill: #999;
      transition: fill 0.3s, transform 0.3s;
    }

    .mode-btn:hover svg {
      fill: #666;
      transform: scale(1.15);
    }

    .mode-btn.active svg {
      fill: #444;
    }

    /* Subtle glow */
    .glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(150, 150, 170, 0.1) 0%, transparent 70%);
      pointer-events: none;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>

<body>
  <div class="glow"></div>

  <div class="scene">
    <div class="container" id="container">
      <!-- Icons will be added by JS -->
    </div>
  </div>

  <div class="toggle-mode">
    <button class="mode-btn" id="sphereBtn" title="Sphere Mode">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" />
        <ellipse cx="12" cy="12" rx="10" ry="4" fill="none" stroke="currentColor" stroke-width="1.5" />
        <line x1="12" y1="2" x2="12" y2="22" stroke="currentColor" stroke-width="1.5" />
      </svg>
    </button>
    <button class="mode-btn active" id="ringsBtn" title="Rings Mode">
      <svg viewBox="0 0 24 24">
        <ellipse cx="12" cy="12" rx="10" ry="4" fill="none" stroke="currentColor" stroke-width="2" />
        <ellipse cx="12" cy="12" rx="10" ry="4" fill="none" stroke="currentColor" stroke-width="2"
          transform="rotate(90 12 12)" />
      </svg>
    </button>
  </div>

      `<svg viewBox="0 0 16 16"><path d="M12.5857 2H7.99995V0H16V8H14V3.41421L8.41417 9L10.7071 11.2929L9.29285 12.7071L6.99995 10.4142L1.70706 15.7071L0.292847 14.2929L5.58574 9L3.29285 6.70711L4.70706 5.29289L6.99995 7.58579L12.5857 2Z" fill="currentColor"/></svg>`,
      // Capricorn
      `<svg viewBox="0 0 16 16"><path fill-rule="evenodd" clip-rule="evenodd" d="M0 1H1C1.91694 1 2.73781 1.41138 3.28809 2.05964C4.00095 1.40184 4.95354 1 6 1C8.20914 1 10 2.79086 10 5V7.53513C10.5883 7.19479 11.2714 7 12 7C14.2091 7 16 8.79086 16 11C16 13.2091 14.2091 15 12 15C10.8053 15 9.73295 14.4762 9 13.6458C8.26706 14.4762 7.19469 15 6 15V13C7.10457 13 8 12.1046 8 11V5C8 3.89543 7.10457 3 6 3C4.89543 3 4 3.89543 4 5V13H2V4C2 3.44772 1.55228 3 1 3H0V1ZM10 11C10 12.1046 10.8954 13 12 13C13.1046 13 14 12.1046 14 11C14 9.89543 13.1046 9 12 9C10.8954 9 10 9.89543 10 11Z" fill="currentColor"/></svg>`,
      // Aquarius
      `<svg viewBox="0 0 16 16"><path d="M4.50005 1.34827L8.00005 3.34827L11.5 1.34827L15.4962 3.63177L14.5039 5.36826L11.5 3.65177L8.00005 5.65177L4.50005 3.65177L1.49618 5.36826L0.503906 3.63177L4.50005 1.34827Z" fill="currentColor"/><path d="M4.50005 10.3483L8.00005 12.3483L11.5 10.3483L15.4962 12.6318L14.5039 14.3683L11.5 12.6518L8.00005 14.6518L4.50005 12.6518L1.49618 14.3683L0.503906 12.6318L4.50005 10.3483Z" fill="currentColor"/><path d="M4.50005 5.84827L0.503906 8.13177L1.49618 9.86826L4.50005 8.15177L8.00005 10.1518L11.5 8.15177L14.5039 9.86826L15.4962 8.13177L11.5 5.84827L8.00005 7.84827L4.50005 5.84827Z" fill="currentColor"/></svg>`,
      // Pisces
      `<svg viewBox="0 0 16 16"><path d="M4.94517 8.99997H2V6.99997H4.94517C4.71828 4.94564 3.80038 3.10059 2.42738 1.70002L3.85558 0.299927C5.58105 2.06004 6.72069 4.40009 6.95516 6.99997H9.04493C9.2794 4.40009 10.419 2.06004 12.1445 0.299927L13.5727 1.70002C12.1997 3.10059 11.2818 4.94564 11.0549 6.99997H14V8.99997H11.0549C11.2818 11.0543 12.1997 12.8994 13.5727 14.2999L12.1445 15.7C10.419 13.9399 9.2794 11.5999 9.04493 8.99997H6.95516C6.72069 11.5999 5.58105 13.9399 3.85558 15.7L2.42738 14.2999C3.80038 12.8994 4.71828 11.0543 4.94517 8.99997Z" fill="currentColor"/></svg>`,
      // Additional: Sun ☉
      `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
      // Moon ☽
      `<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>`,
      // Mercury ☿
      `<svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M12 15v6M9 18h6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M8 5c2-2 6-2 8 0" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>`,
      // Venus ♀
      `<svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M12 14v7M9 18h6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>`,
      // Mars ♂
      `<svg viewBox="0 0 24 24"><circle cx="10" cy="14" r="5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M14 10l6-6M20 4h-5M20 4v5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>`,
      // Jupiter ♃
      `<svg viewBox="0 0 24 24"><path d="M8 4v16M4 12h10c2 0 4-2 4-4s-2-4-4-4H8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>`,
      // Saturn ♄
      `<svg viewBox="0 0 24 24"><path d="M8 3v18M5 6h6M12 6c3 0 5 2 5 5s-2 5-5 5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>`,
      // Neptune ♆
      `<svg viewBox="0 0 24 24"><path d="M12 4v16M8 7l4-3 4 3M6 10h12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="12" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>`,
    ];

    // Configuration
    const outerIconCount = 20;
    const innerIconCount = 12;
    const outerRadius = 250;
    const innerRadius = 150;

    // State
    let isRingsMode = true;
    let isDragging = false;
    let previousMouseX = 0;
    let previousMouseY = 0;
    let outerRotation = 0;
    let innerRotation = 0;
    let innerTiltX = 0;
    let velocityOuter = 0;
    let velocityInner = 0;
    let velocityTiltX = 0;
    let sphereRotationX = -15;
    let sphereRotationY = 0;

    // Animation state for smooth transitions
    let isAnimating = false;
    let animationProgress = 0;
    let animationStartTime = 0;
    const animationDuration = 1200; // ms

    // Container rotation state for smooth transitions
    let currentContainerRotX = -10;
    let currentContainerRotY = 0;
    let targetContainerRotX = -10;
    let targetContainerRotY = 0;

    // Store current and target positions for each icon
    const iconStates = [];

    // Create all icons
    const allIcons = [];
    const outerIcons = [];
    const innerIcons = [];

    for (let i = 0; i < outerIconCount; i++) {
      const icon = document.createElement('div');
      icon.className = 'icon-item';
      icon.innerHTML = `<div class="icon-inner">${iconSVGs[i % iconSVGs.length]}</div>`;
      container.appendChild(icon);
      outerIcons.push(icon);
      allIcons.push(icon);
      iconStates.push({
        currentX: 0, currentY: 0, currentZ: 0, currentScale: 1, currentOpacity: 1,
        targetX: 0, targetY: 0, targetZ: 0, targetScale: 1, targetOpacity: 1,
        ring: 'outer', index: i
      });
    }

    for (let i = 0; i < innerIconCount; i++) {
      const icon = document.createElement('div');
      icon.className = 'icon-item';
      icon.innerHTML = `<div class="icon-inner">${iconSVGs[(i + outerIconCount) % iconSVGs.length]}</div>`;
      container.appendChild(icon);
      innerIcons.push(icon);
      allIcons.push(icon);
      iconStates.push({
        currentX: 0, currentY: 0, currentZ: 0, currentScale: 1, currentOpacity: 1,
        targetX: 0, targetY: 0, targetZ: 0, targetScale: 1, targetOpacity: 1,
        ring: 'inner', index: i
      });
    }

    // Easing function for smooth animation
    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // Calculate ring positions
    function getRingPosition(iconIndex, isOuter) {
      const count = isOuter ? outerIconCount : innerIconCount;
      const radius = isOuter ? outerRadius : innerRadius;
      const rotation = isOuter ? outerRotation : innerRotation;
      const localIndex = isOuter ? iconIndex : iconIndex - outerIconCount;

      const angle = (localIndex / count) * Math.PI * 2 + rotation;

      let x = Math.cos(angle) * radius;
      let z = Math.sin(angle) * radius;
      let y = 0;

      // Apply tilt for inner ring
      if (!isOuter) {
        const tiltRad = innerTiltX * Math.PI / 180;
        const newY = z * Math.sin(tiltRad);
        const newZ = z * Math.cos(tiltRad);
        y = newY;
        z = newZ;
      }

      const scale = 0.6 + (z + radius) / (radius * 2) * (isOuter ? 0.5 : 0.4);
      const opacity = 0.4 + (z + radius) / (radius * 2) * 0.5;

      return { x, y, z, scale, opacity };
    }

    // Calculate sphere positions
    function getSpherePosition(iconIndex) {
      const count = allIcons.length;
      const radius = 200;
      const phi = Math.PI * (3 - Math.sqrt(5));

      const yNorm = 1 - (iconIndex / (count - 1)) * 2;
      const radiusAtY = Math.sqrt(1 - yNorm * yNorm);
      const theta = phi * iconIndex;

      // Base position on sphere
      let x = Math.cos(theta) * radiusAtY * radius;
      let z = Math.sin(theta) * radiusAtY * radius;
      let y = yNorm * radius;

      // Apply sphere rotation to position (not to the icon itself)
      // Rotate around Y axis
      const cosY = Math.cos(sphereRotationY * Math.PI / 180);
      const sinY = Math.sin(sphereRotationY * Math.PI / 180);
      const rotatedX = x * cosY + z * sinY;
      const rotatedZ = -x * sinY + z * cosY;
      x = rotatedX;
      z = rotatedZ;

      // Rotate around X axis
      const cosX = Math.cos(sphereRotationX * Math.PI / 180);
      const sinX = Math.sin(sphereRotationX * Math.PI / 180);
      const rotatedY = y * cosX - z * sinX;
      const rotatedZ2 = y * sinX + z * cosX;
      y = rotatedY;
      z = rotatedZ2;

      const scale = 0.6 + (z + radius) / (radius * 2) * 0.5;
      const opacity = 0.4 + (z + radius) / (radius * 2) * 0.5;

      return { x, y, z, scale, opacity };
    }

    // Update target positions based on mode
    function updateTargets() {
      allIcons.forEach((icon, i) => {
        const state = iconStates[i];
        let pos;

        if (isRingsMode) {
          const isOuter = i < outerIconCount;
          pos = getRingPosition(i, isOuter);
        } else {
          pos = getSpherePosition(i);
        }

        state.targetX = pos.x;
        state.targetY = pos.y;
        state.targetZ = pos.z;
        state.targetScale = pos.scale;
        state.targetOpacity = pos.opacity;
      });
    }

    // Apply positions to DOM
    function applyPositions() {
      allIcons.forEach((icon, i) => {
        const state = iconStates[i];
        icon.style.transform = `translate3d(${state.currentX}px, ${state.currentY}px, ${state.currentZ}px) scale(${state.currentScale})`;
        icon.style.opacity = state.currentOpacity;
        icon.style.zIndex = Math.round(state.currentZ + 300);
      });
    }

    // Interpolate current positions toward targets
    function interpolatePositions(factor) {
      allIcons.forEach((icon, i) => {
        const state = iconStates[i];
        state.currentX += (state.targetX - state.currentX) * factor;
        state.currentY += (state.targetY - state.currentY) * factor;
        state.currentZ += (state.targetZ - state.currentZ) * factor;
        state.currentScale += (state.targetScale - state.currentScale) * factor;
        state.currentOpacity += (state.targetOpacity - state.currentOpacity) * factor;
      });
    }

    // Snap current positions to targets
    function snapToTargets() {
      allIcons.forEach((icon, i) => {
        const state = iconStates[i];
        state.currentX = state.targetX;
        state.currentY = state.targetY;
        state.currentZ = state.targetZ;
        state.currentScale = state.targetScale;
        state.currentOpacity = state.targetOpacity;
      });
    }

    // Initialize positions
    updateTargets();
    snapToTargets();
    applyPositions();

    // Interpolate container rotation
    function updateContainerRotation(lerpFactor) {
      currentContainerRotX += (targetContainerRotX - currentContainerRotX) * lerpFactor;
      currentContainerRotY += (targetContainerRotY - currentContainerRotY) * lerpFactor;
      container.style.transform = `rotateX(${currentContainerRotX}deg) rotateY(${currentContainerRotY}deg)`;
    }

    // Main animation loop
    function animate(timestamp) {
      // Handle mode transition animation
      if (isAnimating) {
        const elapsed = timestamp - animationStartTime;
        animationProgress = Math.min(elapsed / animationDuration, 1);
        const easedProgress = easeInOutCubic(animationProgress);

        // Smoothly interpolate toward targets
        interpolatePositions(easedProgress * 0.15 + 0.02);

        // Only rotate container for rings mode transition
        if (isRingsMode) {
          updateContainerRotation(0.05 + easedProgress * 0.05);
        }

        if (animationProgress >= 1) {
          isAnimating = false;
          snapToTargets();
          if (isRingsMode) {
            currentContainerRotX = targetContainerRotX;
            currentContainerRotY = targetContainerRotY;
          }
        }
      } else if (!isDragging) {
        // Apply momentum and auto-rotation (only when NOT animating transition)
        const autoRotateSpeed = 0.3;
        
        if (isRingsMode) {
          // Auto-rotate rings at the same speed as sphere mode
          outerRotation += autoRotateSpeed * 0.01;
          innerRotation += autoRotateSpeed * 0.008;
          
          outerRotation += velocityOuter;
          innerRotation += velocityInner;
          innerTiltX += velocityTiltX;

          velocityOuter *= 0.97;
          velocityInner *= 0.97;
          velocityTiltX *= 0.95;
          innerTiltX *= 0.998;

          updateTargets();
          interpolatePositions(0.15);
        } else {
          // Sphere mode: auto-rotate by updating rotation values
          // Icons stay flat, only their positions change
          sphereRotationY += autoRotateSpeed;
          sphereRotationX = -15 + Math.sin(Date.now() * 0.0003) * 5;
          updateTargets();
          interpolatePositions(0.15);
        }
      } else {
        // During drag, update immediately
        updateTargets();
        interpolatePositions(0.3);
      }

      applyPositions();
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    // Mouse interaction
    document.addEventListener('mousedown', (e) => {
      if (isAnimating) return;
      isDragging = true;
      previousMouseX = e.clientX;
      previousMouseY = e.clientY;
      velocityOuter = 0;
      velocityInner = 0;
      velocityTiltX = 0;
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging || isAnimating) return;

      const deltaX = e.clientX - previousMouseX;
      const deltaY = e.clientY - previousMouseY;

      if (isRingsMode) {
        const outerDelta = deltaX * 0.004;
        const innerDelta = deltaX * 0.003;
        const tiltDelta = deltaY * 0.3;

        outerRotation += outerDelta;
        innerRotation += innerDelta;
        innerTiltX += tiltDelta;
        innerTiltX = Math.max(-80, Math.min(80, innerTiltX));

        velocityOuter = outerDelta;
        velocityInner = innerDelta;
        velocityTiltX = tiltDelta;
      } else {
        // Sphere mode: update rotation values, icons stay flat
        sphereRotationY += deltaX * 0.5;
        sphereRotationX -= deltaY * 0.3;
        sphereRotationX = Math.max(-60, Math.min(60, sphereRotationX));
        updateTargets();
      }

      previousMouseX = e.clientX;
      previousMouseY = e.clientY;
    });

    document.addEventListener('mouseup', () => { isDragging = false; });
    document.addEventListener('mouseleave', () => { isDragging = false; });

    // Touch support
    document.addEventListener('touchstart', (e) => {
      if (isAnimating) return;
      isDragging = true;
      previousMouseX = e.touches[0].clientX;
      previousMouseY = e.touches[0].clientY;
      velocityOuter = 0;
      velocityInner = 0;
      velocityTiltX = 0;
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (!isDragging || isAnimating) return;

      const deltaX = e.touches[0].clientX - previousMouseX;
      const deltaY = e.touches[0].clientY - previousMouseY;

      if (isRingsMode) {
        const outerDelta = deltaX * 0.004;
        const innerDelta = deltaX * 0.003;
        const tiltDelta = deltaY * 0.3;

        outerRotation += outerDelta;
        innerRotation += innerDelta;
        innerTiltX += tiltDelta;
        innerTiltX = Math.max(-80, Math.min(80, innerTiltX));

        velocityOuter = outerDelta;
        velocityInner = innerDelta;
        velocityTiltX = tiltDelta;
      } else {
        // Sphere mode: update rotation values, icons stay flat
        sphereRotationY += deltaX * 0.5;
        sphereRotationX -= deltaY * 0.3;
        sphereRotationX = Math.max(-60, Math.min(60, sphereRotationX));
        updateTargets();
      }

      previousMouseX = e.touches[0].clientX;
      previousMouseY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchend', () => { isDragging = false; });

    // Mode switching
    sphereBtn.addEventListener('click', () => {
      if (!isRingsMode || isAnimating) return;

      isRingsMode = false;
      isAnimating = true;
      animationStartTime = performance.now();
      animationProgress = 0;

      sphereBtn.classList.add('active');
      ringsBtn.classList.remove('active');

      // Reset container rotation for sphere mode (icons stay flat)
      container.style.transform = 'rotateX(0deg) rotateY(0deg)';
      currentContainerRotX = 0;
      currentContainerRotY = 0;
      sphereRotationX = -15;
      sphereRotationY = 0;
      updateTargets();
    });

    ringsBtn.addEventListener('click', () => {
      if (isRingsMode || isAnimating) return;

      isRingsMode = true;
      isAnimating = true;
      animationStartTime = performance.now();
      animationProgress = 0;
      innerTiltX = 0;

      ringsBtn.classList.add('active');
      sphereBtn.classList.remove('active');

      // Capture current sphere position as starting point
      currentContainerRotX = sphereRotationX;
      currentContainerRotY = sphereRotationY;

      // Set target rotation for rings mode - will be smoothly interpolated
      targetContainerRotX = -10;
      targetContainerRotY = 0;

      // Don't set container.style.transform - let animation loop handle it smoothly
      updateTargets();
    });
  </script>
