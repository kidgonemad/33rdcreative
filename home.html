<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>33rd Creative</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #f5f5f5;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        body.gallery-open {
            overflow: auto !important;
            position: relative;
            width: 100%;
            min-height: 100vh;
        }

        .transition-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            pointer-events: none;
        }

        .transition-black {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 0;
            background: #0a0a0a;
            transform: translateY(-50%);
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.4s;
        }

        .main-content.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            width: 700px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gradient-bar {
            position: relative;
            display: flex;
            align-items: center;
            height: 280px;
        }

        .bar-segment {
            cursor: pointer;
            position: relative;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transform-origin: center;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gradient-bar.squishing .bar-segment {
            transform: scaleY(0.01);
        }

        .bar-segment:first-child {
            border-radius: 3px 0 0 3px;
        }

        .bar-segment:last-child {
            border-radius: 0 3px 3px 0;
        }

        .bar-segment .track-title {
            position: absolute;
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 6px;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.3s, transform 0.3s;
            white-space: nowrap;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .bar-segment.expanded .track-title {
            opacity: 1;
            transform: scale(1);
        }

        .bar-segment .texture {
            display: none;
        }

        .bar-segment.expanded .texture {
            opacity: 1;
        }

        .dark-content {
            position: fixed;
            inset: 0;
            background: #0a0a0a;
            opacity: 0;
            pointer-events: none;
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            padding: 20px;
            z-index: 100;
        }

        .dark-content.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .mini-container {
            transform: scale(0.15);
            transform-origin: top right;
        }

        .gradient-bar-mini {
            display: flex;
            align-items: center;
            height: 280px;
        }

        .bar-segment-mini {
            cursor: pointer;
            position: relative;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bar-segment-mini:first-child {
            border-radius: 3px 0 0 3px;
        }

        .bar-segment-mini:last-child {
            border-radius: 0 3px 3px 0;
        }

        .bar-segment-mini .track-title {
            position: absolute;
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 6px;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.3s, transform 0.3s;
            white-space: nowrap;
        }

        .bar-segment-mini.expanded .track-title {
            opacity: 1;
            transform: scale(1);
        }

        .orb {
            position: fixed;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            filter: blur(50px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
            z-index: 50;
        }

        .dark-content.visible~.orb {
            opacity: 0.8;
        }

        .social-icons {
            display: flex;
            gap: 28px;
            margin-top: 60px;
            opacity: 0.4;
        }

        .social-icons svg {
            width: 20px;
            height: 20px;
            fill: #999;
            cursor: pointer;
            transition: fill 0.3s, transform 0.3s;
        }

        .social-icons svg:hover {
            fill: #666;
            transform: scale(1.15);
        }

        .social-icons a {
            display: flex;
        }

        .social-icons a svg {
            fill: #999;
        }

        .social-icons a:hover svg {
            fill: #E1306C;
        }

        /* Can't access animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }

        .social-icons svg.shake {
            animation: shake 0.5s ease;
            fill: #e9c31e !important;
        }

        .current-track {
            position: fixed;
            bottom: 30px;
            left: 30px;
            font-size: 14px;
            letter-spacing: 4px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.5s;
            text-transform: uppercase;
            z-index: 200;
        }

        .dark-content.visible~.current-track {
            opacity: 1;
        }

        .esc-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #444;
            font-size: 11px;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 200;
        }

        .esc-mobile {
            display: none;
        }

        .dark-content.visible~.esc-hint {
            opacity: 0.5;
        }

        /* Menu Icon */
        .menu-icon {
            position: fixed;
            top: 25px;
            right: 25px;
            width: 24px;
            height: 24px;
            cursor: pointer;
            z-index: 500;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            transition: opacity 0.3s;
            transform: rotate(90deg);
        }

        .menu-icon .line {
            width: 18px;
            height: 2px;
            background: #888;
            transition: all 0.3s;
            position: absolute;
        }

        .menu-icon .line:nth-child(1) {
            transform: translateY(-4px);
        }

        .menu-icon .line:nth-child(2) {
            transform: translateY(4px);
        }

        .menu-icon .line:nth-child(3) {
            width: 2px;
            height: 18px;
            transform: translateX(-4px);
            opacity: 0;
        }

        .menu-icon .line:nth-child(4) {
            width: 2px;
            height: 18px;
            transform: translateX(4px);
            opacity: 0;
        }

        .menu-icon.grid .line:nth-child(3),
        .menu-icon.grid .line:nth-child(4) {
            opacity: 1;
        }

        .menu-icon:hover .line {
            background: #333;
        }

        /* Grid View */
        .grid-view {
            position: fixed;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            z-index: 400;
            transition: opacity 0.5s, background 0.8s;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #d8d8d8;
            perspective: 1200px;
        }

        .grid-view.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .grid-scene {
            transform-style: preserve-3d;
            transform: rotateX(12deg) rotateY(-8deg);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 25px;
            transform-style: preserve-3d;
        }

        /* 3D Cube */
        .cube-wrapper {
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .cube-wrapper:hover {
            transform: translateZ(80px) rotateX(-5deg) rotateY(5deg);
            z-index: 100;
        }

        .cube-wrapper.faded {
            transform: translateZ(-50px);
            opacity: 0.2;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: translateZ(-50px);
            transition: transform 0.5s;
        }

        .cube-face {
            position: absolute;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            backface-visibility: visible;
        }

        .cube-face.front {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0.4) 100%);
            transform: translateZ(50px);
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .cube-face.back {
            background: rgba(150, 150, 150, 0.3);
            transform: rotateY(180deg) translateZ(50px);
        }

        .cube-face.right {
            background: linear-gradient(to left, rgba(200, 200, 200, 0.6), rgba(180, 180, 180, 0.4));
            transform: rotateY(90deg) translateZ(50px);
            width: 100px;
        }

        .cube-face.left {
            background: linear-gradient(to right, rgba(160, 160, 160, 0.5), rgba(140, 140, 140, 0.3));
            transform: rotateY(-90deg) translateZ(50px);
            width: 100px;
        }

        .cube-face.top {
            background: linear-gradient(to bottom, rgba(230, 230, 230, 0.7), rgba(200, 200, 200, 0.5));
            transform: rotateX(90deg) translateZ(50px);
            height: 100px;
        }

        .cube-face.bottom {
            background: rgba(120, 120, 120, 0.4);
            transform: rotateX(-90deg) translateZ(50px);
            height: 100px;
        }

        /* Shadow under cube */
        .cube-shadow {
            position: absolute;
            bottom: -60px;
            left: 10%;
            width: 80%;
            height: 20px;
            background: radial-gradient(ellipse, rgba(0, 0, 0, 0.3) 0%, transparent 70%);
            transform: rotateX(90deg);
            filter: blur(5px);
        }

        /* Reflection */
        .cube-reflection {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100px;
            height: 100px;
            transform-style: preserve-3d;
            transform: rotateX(180deg) translateZ(-10px);
            opacity: 0.15;
            filter: blur(1px);
            pointer-events: none;
        }

        .cube-reflection .cube-face.front {
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.3), transparent);
        }

        .cube-wrapper:hover .cube-face.front {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.8) 100%);
            color: rgba(0, 0, 0, 0.5);
        }

        /* Track info overlay */
        .track-info-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
            z-index: 410;
        }

        .track-info-overlay.visible {
            opacity: 1;
        }

        .track-info-overlay .artist {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.15);
        }

        .track-info-overlay .song {
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 6px;
            text-transform: uppercase;
            opacity: 0.7;
        }

        /* Close button */
        .close-grid {
            display: none !important;
            position: fixed;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 450;
            font-size: 24px;
            color: #333;
        }

        .grid-view.visible~.close-grid {
            opacity: 1;
            pointer-events: auto;
        }

        /* Mobile styles */
        @media (max-width: 768px) {
            /* First page: vertical columns with tilt */
            .container {
                width: 90vw !important;
                height: auto !important;
                max-width: 340px;
                perspective: 800px;
            }

            .gradient-bar {
                flex-direction: column !important;
                height: auto !important;
                width: 100%;
                transform: rotateX(4deg) rotateY(-2deg);
                transform-style: preserve-3d;
            }

            .bar-segment {
                width: 100% !important;
                height: 44px !important;
                margin: 0 !important;
                border-radius: 0 !important;
            }

            .bar-segment:first-child {
                border-radius: 4px 4px 0 0 !important;
            }

            .bar-segment:last-child {
                border-radius: 0 0 4px 4px !important;
            }

            .bar-segment .track-title {
                font-size: 14px !important;
                letter-spacing: 3px !important;
            }

            /* Hide social icons on mobile */
            .social-icons {
                display: none !important;
            }

            /* Grid: vertical layout */
            .grid-scene {
                transform: rotateX(8deg) rotateY(-5deg);
            }

            .grid-container {
                grid-template-columns: repeat(3, 60px) !important;
                grid-template-rows: repeat(6, 60px) !important;
                gap: 12px !important;
            }

            .cube-wrapper {
                width: 60px !important;
                height: 60px !important;
            }

            .cube-face {
                width: 60px !important;
                height: 60px !important;
                font-size: 20px !important;
            }

            .cube-face.right,
            .cube-face.left {
                width: 60px !important;
            }

            .cube-face.top,
            .cube-face.bottom {
                height: 60px !important;
            }

            .cube-face.front {
                transform: translateZ(30px) !important;
            }

            .cube-face.back {
                transform: rotateY(180deg) translateZ(30px) !important;
            }

            .cube-face.right {
                transform: rotateY(90deg) translateZ(30px) !important;
            }

            .cube-face.left {
                transform: rotateY(-90deg) translateZ(30px) !important;
            }

            .cube-face.top {
                transform: rotateX(90deg) translateZ(30px) !important;
            }

            .cube-face.bottom {
                transform: rotateX(-90deg) translateZ(30px) !important;
            }

            .cube {
                transform: translateZ(-30px) !important;
            }

            /* Hide shadows on mobile by default, except bottom row */
            .cube-wrapper .cube-shadow {
                opacity: 0 !important;
                transition: opacity 0.3s;
            }

            /* Bottom 3 cubes (indices 15, 16, 17 in 3x6 grid) always show shadow */
            .cube-wrapper:nth-child(n+16) .cube-shadow {
                opacity: 1 !important;
            }

            /* Show shadow when cube is clicked/active */
            .cube-wrapper.shadow-active .cube-shadow {
                opacity: 1 !important;
            }

            /* Social icons */
            .social-icons {
                gap: 20px !important;
                margin-top: 40px !important;
            }

            .social-icons svg {
                width: 18px !important;
                height: 18px !important;
            }

            /* Track info overlay */
            .track-info-overlay .artist {
                font-size: 32px !important;
                letter-spacing: 4px !important;
            }

            .track-info-overlay .song {
                font-size: 14px !important;
                letter-spacing: 3px !important;
            }

            /* Current track label */
            .current-track {
                font-size: 11px !important;
                letter-spacing: 3px !important;
                bottom: 20px !important;
                left: 20px !important;
            }

            /* ESC hint - change to tap hint on mobile */
            .esc-hint {
                font-size: 10px !important;
                bottom: 20px !important;
            }

            .esc-desktop {
                display: none !important;
            }

            .esc-mobile {
                display: inline !important;
            }

            /* Global mini bar */
            .global-mini-bar {
                top: 12px !important;
                right: 12px !important;
                transform: scale(0.14) !important;
            }

            /* Galleries - fix mobile scrolling */
            .nuclear-gallery,
            .bassvictim-gallery,
            .lucki-gallery {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                min-height: 100vh !important;
                height: auto !important;
                overflow-y: visible !important;
            }

            /* Gallery grids - all three */
            .nuclear-grid-container,
            .bassvictim-grid-container,
            .lucki-grid-container {
                padding: 60px 16px 40px !important;
            }

            .nuclear-grid,
            .bassvictim-grid,
            .lucki-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)) !important;
                gap: 10px !important;
            }

            /* Gallery items */
            .nuclear-item,
            .bassvictim-item,
            .lucki-item {
                border-radius: 4px !important;
                touch-action: pan-y !important;
            }

            /* Glow effects - smaller on mobile */
            .nuclear-glow,
            .bassvictim-glow,
            .lucki-glow {
                width: 300px !important;
                height: 300px !important;
            }

            /* Lightbox */
            .nuclear-lightbox img {
                max-width: 95vw !important;
                max-height: 85vh !important;
                border-radius: 4px !important;
            }

            .nuclear-lightbox-close {
                top: 15px !important;
                right: 15px !important;
                width: 40px !important;
                height: 40px !important;
            }

            /* Sphere view */
            .sphere-container {
                width: 320px !important;
                height: 320px !important;
            }

            .icon-item {
                width: 36px !important;
                height: 36px !important;
                margin-left: -18px !important;
                margin-top: -18px !important;
            }

            .icon-inner svg {
                width: 28px !important;
                height: 28px !important;
            }

            .sphere-glow {
                width: 300px !important;
                height: 300px !important;
            }

            /* Menu icon */
            .menu-icon {
                top: 16px !important;
                right: 16px !important;
            }

            /* Intro */
            .intro-svg-container {
                width: 90% !important;
            }

            /* Toast */
            .toast {
                bottom: 20px !important;
                font-size: 11px !important;
                padding: 10px 18px !important;
            }
        }

        .edit-panel {
            display: none !important;
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            width: 240px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
            font-size: 11px;
            z-index: 1000;
            transition: transform 0.3s, opacity 0.3s, background 0.3s;
        }

        .edit-panel.hidden {
            transform: translateX(-280px);
            opacity: 0;
            pointer-events: none;
        }

        .edit-panel.dark-theme {
            background: rgba(30, 30, 30, 0.95);
        }

        .edit-panel.dark-theme h3 {
            color: #666;
        }

        .edit-panel.dark-theme label {
            color: #888;
        }

        .edit-panel.dark-theme label span {
            color: #ccc;
        }

        .edit-panel.dark-theme input[type="range"] {
            background: #333;
        }

        .edit-panel.dark-theme input[type="range"]::-webkit-slider-thumb {
            background: #fff;
        }

        .edit-panel h3 {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .control-group {
            margin-bottom: 14px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            color: #666;
            margin-bottom: 6px;
        }

        .control-group label span {
            color: #333;
            font-weight: 500;
        }

        .control-group input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: #e0e0e0;
            border-radius: 2px;
            outline: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #333;
            border-radius: 50%;
            cursor: pointer;
        }

        .toggle-btn {
            display: none !important;
            position: fixed;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
            z-index: 999;
            transition: background 0.3s;
        }

        .toggle-btn.dark-theme {
            background: rgba(30, 30, 30, 0.95);
        }

        .toggle-btn.dark-theme svg {
            fill: #888;
        }

        .toggle-btn svg {
            width: 18px;
            height: 18px;
            fill: #666;
        }

        .toggle-btn.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .edit-panel .close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            opacity: 0.4;
        }

        .edit-panel .close-btn:hover {
            opacity: 1;
        }

        .edit-panel .close-btn svg {
            width: 14px;
            height: 14px;
            fill: #333;
        }

        .edit-panel.dark-theme .close-btn svg {
            fill: #888;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            font-family: inherit;
        }

        .reset-btn {
            background: #f0f0f0;
            color: #666;
        }

        .edit-panel.dark-theme .reset-btn {
            background: #333;
            color: #999;
        }

        .save-btn {
            background: #333;
            color: #fff;
        }

        .edit-panel.dark-theme .save-btn {
            background: #fff;
            color: #333;
        }

        .save-btn.saved {
            background: #2ecc71 !important;
            color: #fff !important;
        }

    <div class="toast" id="toast">Settings saved!</div>

    <script>
        const segments = document.querySelectorAll('#gradientBar .bar-segment');
        const segmentsMini = document.querySelectorAll('#gradientBarMini .bar-segment-mini');
        const gradientBar = document.getElementById('gradientBar');
        const gradientBarMini = document.getElementById('gradientBarMini');
        const mainContent = document.getElementById('mainContent');
        const darkContent = document.getElementById('darkContent');
        const transitionBlack = document.getElementById('transitionBlack');
        const orb = document.getElementById('orb');
        const currentTrackLabel = document.getElementById('currentTrack');
        const toast = document.getElementById('toast');
        const editPanel = document.getElementById('editPanel');
        const toggleBtn = document.getElementById('toggleBtn');
        const menuIcon = document.getElementById('menuIcon');
        const gridView = document.getElementById('gridView');
        const gridContainer = document.getElementById('gridContainer');
        const closeGrid = document.getElementById('closeGrid');
        const trackInfoOverlay = document.getElementById('trackInfoOverlay');
        const overlayArtist = document.getElementById('overlayArtist');
        const overlaySong = document.getElementById('overlaySong');
        const sphereView = document.getElementById('sphereView');
        const sphereContainer = document.getElementById('sphereContainer');
        const sphereModeBtn = document.getElementById('sphereModeBtn');
        const ringsModeBtn = document.getElementById('ringsModeBtn');
        const globalMiniBar = document.getElementById('globalMiniBar');

        const totalSegments = 12;
        const trackNames = ['NUCLEAR', 'WAVES', 'DRIFT', '33', 'BASSVICTIM', 'ECHOES', 'PULSE', 'LUCKI', 'FLUX', 'HAZE', 'BLOOM', 'STATIC'];
        const artistNames = ['SANNHET', 'FLYING LOTUS', 'TYCHO', 'BONOBO', 'MASSIVE ATTACK', 'BOARDS OF CANADA', 'APHEX TWIN', 'BURIAL', 'FOUR TET', 'CARIBOU', 'MODERAT', 'AMON TOBIN'];

        const grayColors = ['#c8c8c8', '#bcbcbc', '#afafaf', '#a2a2a2', '#959595', '#888888', '#7a7a7a', '#6d6d6d', '#5f5f5f', '#525252', '#3d3d3d', '#282828'];

        // Distinct colors across the spectrum for hover effect - each column has unique color
        const hoverColors = ['#e9c31e', '#4ecdc4', '#667eea', '#764ba2', '#e91e1e', '#ff9f43', '#1dd1a1', '#5f27cd', '#00d2d3', '#ff6b81', '#7bed9f', '#a55eea'];

        const trackColors = ['#e9c31e', '#4ecdc4', '#667eea', '#764ba2', '#e91e1e', '#ff9f43', '#1dd1a1', '#5f27cd', '#00d2d3', '#ff6b81', '#7bed9f', '#a55eea'];

        // Create 3D cubes
        const cubeData = [];
        for (let i = 1; i <= 18; i++) {
            cubeData.push({ num: String(i).padStart(2, '0'), track: (i - 1) % 5 });
        }

        cubeData.forEach(data => {
            const wrapper = document.createElement('div');
            wrapper.className = 'cube-wrapper';
            wrapper.dataset.track = data.track;
            wrapper.dataset.color = trackColors[data.track];
            wrapper.dataset.artist = artistNames[data.track];
            wrapper.dataset.song = trackNames[data.track];

            wrapper.innerHTML = `
                <div class="cube">
                    <div class="cube-face front"></div>
                    <div class="cube-face back"></div>
                    <div class="cube-face right"></div>
                    <div class="cube-face left"></div>
                    <div class="cube-face top"></div>
                    <div class="cube-face bottom"></div>
                </div>
                <div class="cube-shadow"></div>
            `;
            gridContainer.appendChild(wrapper);
        });

        const cubeWrappers = document.querySelectorAll('.cube-wrapper');

        const defaults = { expandSize: 250, baseHeight: 230, minHeight: 60, falloff: 30, smoothing: 0.12, barWidth: 44, colorBlend: 0.12 };

        let params = { ...defaults };
        const saved = localStorage.getItem('prologueEpSettings9');
        if (saved) { try { params = { ...defaults, ...JSON.parse(saved) }; } catch (e) { } }

        let activeTrack = null;
        let hoveredIndex = -1;
        let hoveredIndexMini = -1;
        let isDarkMode = false;
        let isGridMode = false;
        let isSphereMode = false;
        let isNuclearMode = false;
        let isBassvictimMode = false;
        let isLuckiMode = false;
        let isGodraysMode = false;
        let isTransitioning = false;
        let menuState = 0; // 0 = lines, 1 = grid, 2 = sphere, 3 = godrays/33

        const currentWidths = new Array(totalSegments).fill(params.barWidth);
        const currentHeights = new Array(totalSegments).fill(params.baseHeight);
        const targetWidths = new Array(totalSegments).fill(params.barWidth);
        const targetHeights = new Array(totalSegments).fill(params.baseHeight);

        const currentWidthsMini = new Array(totalSegments).fill(params.barWidth);
        const currentHeightsMini = new Array(totalSegments).fill(params.baseHeight);
        const targetWidthsMini = new Array(totalSegments).fill(params.barWidth);
        const targetHeightsMini = new Array(totalSegments).fill(params.baseHeight);

        const isMobile = window.matchMedia('(max-width: 768px)').matches;

        function initSegments() {
            segments.forEach((seg, i) => {
                seg.style.background = grayColors[i];
                if (isMobile) {
                    seg.style.width = '100%';
                    seg.style.height = '44px';
                } else {
                    seg.style.height = params.baseHeight + 'px';
                    seg.style.width = params.barWidth + 'px';
                }
            });
            segmentsMini.forEach((seg, i) => {
                seg.style.background = grayColors[i];
                seg.style.height = params.baseHeight + 'px';
                seg.style.width = params.barWidth + 'px';
            });
        }

        initSegments();

        function blendColors(c1, c2, r) {
            const h = c => parseInt(c, 16);
            const r1 = h(c1.slice(1, 3)), g1 = h(c1.slice(3, 5)), b1 = h(c1.slice(5, 7));
            const r2 = h(c2.slice(1, 3)), g2 = h(c2.slice(3, 5)), b2 = h(c2.slice(5, 7));
            return `rgb(${Math.round(r1 + (r2 - r1) * r)},${Math.round(g1 + (g2 - g1) * r)},${Math.round(b1 + (b2 - b1) * r)})`;
        }

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r},${g},${b},${alpha})`;
        }

        function animate() {
            if (!isDarkMode && !isGridMode) {
                if (isMobile) {
                    // Mobile: width stays 100%, only height and color animate
                    for (let i = 0; i < totalSegments; i++) {
                        if (hoveredIndex === -1) {
                            targetHeights[i] = 44;
                        } else if (i === hoveredIndex) {
                            targetHeights[i] = 70;
                        } else {
                            const d = Math.abs(i - hoveredIndex);
                            targetHeights[i] = Math.max(32, 70 - (d * 8));
                        }
                    }

                    segments.forEach((seg, i) => {
                        currentHeights[i] += (targetHeights[i] - currentHeights[i]) * params.smoothing;
                        seg.style.height = currentHeights[i] + 'px';
                        seg.classList.toggle('expanded', currentHeights[i] > 55);

                        if (hoveredIndex !== -1) {
                            const d = Math.abs(i - hoveredIndex);
                            const blend = Math.max(0, 1 - (d * params.colorBlend));
                            seg.style.background = blendColors(grayColors[i], hoverColors[i], blend);
                        } else {
                            seg.style.background = grayColors[i];
                        }
                    });
                } else {
                    // Desktop: normal behavior
                    for (let i = 0; i < totalSegments; i++) {
                        if (hoveredIndex === -1) {
                            targetWidths[i] = params.barWidth;
                            targetHeights[i] = params.baseHeight;
                        } else if (i === hoveredIndex) {
                            targetWidths[i] = params.expandSize;
                            targetHeights[i] = params.expandSize;
                        } else {
                            targetWidths[i] = params.barWidth;
                            const d = Math.abs(i - hoveredIndex);
                            targetHeights[i] = Math.max(params.minHeight, params.expandSize - (d * params.falloff));
                        }
                    }

                    segments.forEach((seg, i) => {
                        currentWidths[i] += (targetWidths[i] - currentWidths[i]) * params.smoothing;
                        currentHeights[i] += (targetHeights[i] - currentHeights[i]) * params.smoothing;
                        seg.style.width = currentWidths[i] + 'px';
                        seg.style.height = currentHeights[i] + 'px';
                        seg.classList.toggle('expanded', currentWidths[i] > params.barWidth + 50);

                        if (hoveredIndex !== -1) {
                            const d = Math.abs(i - hoveredIndex);
                            const blend = Math.max(0, 1 - (d * params.colorBlend));
                            seg.style.background = blendColors(grayColors[i], hoverColors[i], blend);
                        } else {
                            seg.style.background = grayColors[i];
                        }
                    });
                }
            }

            for (let i = 0; i < totalSegments; i++) {
                if (hoveredIndexMini === -1) {
                    targetWidthsMini[i] = params.barWidth;
                    targetHeightsMini[i] = params.baseHeight;
                } else if (i === hoveredIndexMini) {
                    targetWidthsMini[i] = params.expandSize;
                    targetHeightsMini[i] = params.expandSize;
                } else {
                    targetWidthsMini[i] = params.barWidth;
                    const d = Math.abs(i - hoveredIndexMini);
                    targetHeightsMini[i] = Math.max(params.minHeight, params.expandSize - (d * params.falloff));
                }
            }

            segmentsMini.forEach((seg, i) => {
                currentWidthsMini[i] += (targetWidthsMini[i] - currentWidthsMini[i]) * params.smoothing;
                currentHeightsMini[i] += (targetHeightsMini[i] - currentHeightsMini[i]) * params.smoothing;
                seg.style.width = currentWidthsMini[i] + 'px';
                seg.style.height = currentHeightsMini[i] + 'px';
                seg.classList.toggle('expanded', currentWidthsMini[i] > params.barWidth + 50);

                if (hoveredIndexMini !== -1) {
                    const d = Math.abs(i - hoveredIndexMini);
                    const blend = Math.max(0, 1 - (d * params.colorBlend));
                    seg.style.background = blendColors(grayColors[i], hoverColors[i], blend);
                } else {
                    seg.style.background = grayColors[i];
                }
            });

            requestAnimationFrame(animate);
        }

        animate();

        segments.forEach((seg, i) => {
            seg.addEventListener('mouseenter', () => {
                if (isTransitioning || isDarkMode || isGridMode) return;
                hoveredIndex = i;
                const t = parseInt(seg.dataset.track);
                activeTrack = t;
                orb.style.background = seg.dataset.color;
                currentTrackLabel.textContent = trackNames[t];
                currentTrackLabel.style.color = seg.dataset.color;
            });
        });

        gradientBar.addEventListener('mouseleave', () => {
            if (isTransitioning || isDarkMode || isGridMode) return;
            hoveredIndex = -1;
            activeTrack = null;
        });

        // Mobile touch: tap to select, second tap to enter
        if (isMobile) {
            let mobileTiltX = 0, mobileTiltY = 0;
            let targetTiltX = 4, targetTiltY = -2;

            segments.forEach((seg, i) => {
                seg.addEventListener('touchstart', (e) => {
                    if (isTransitioning || isDarkMode || isGridMode) return;
                    const t = parseInt(seg.dataset.track);

                    // Tilt toward the tapped segment
                    const ratio = i / (totalSegments - 1); // 0 at top, 1 at bottom
                    targetTiltX = 8 - (ratio * 16); // tilt forward at top, back at bottom
                    targetTiltY = -2;

                    if (hoveredIndex === i) {
                        // Second tap on same bar - trigger click action
                        activeTrack = t;
                    } else {
                        // First tap - select this bar
                        hoveredIndex = i;
                        activeTrack = t;
                        orb.style.background = seg.dataset.color;
                        currentTrackLabel.textContent = trackNames[t];
                        currentTrackLabel.style.color = seg.dataset.color;
                    }
                });
            });

            // Animate tilt
            function animateMobileTilt() {
                mobileTiltX += (targetTiltX - mobileTiltX) * 0.08;
                mobileTiltY += (targetTiltY - mobileTiltY) * 0.08;
                gradientBar.style.transform = `rotateX(${mobileTiltX}deg) rotateY(${mobileTiltY}deg)`;
                requestAnimationFrame(animateMobileTilt);
            }
            animateMobileTilt();

            // Reset tilt and selection when tapping outside
            document.addEventListener('touchstart', (e) => {
                if (!gradientBar.contains(e.target)) {
                    hoveredIndex = -1;
                    activeTrack = null;
                    targetTiltX = 4;
                    targetTiltY = -2;
                }
            });
        }

        function initSphereIcons() {

                sphereInnerIcons.push(icon);
                sphereAllIcons.push(icon);
                sphereIconStates.push({ currentX: 0, currentY: 0, currentZ: 0, currentScale: 1, currentOpacity: 1, targetX: 0, targetY: 0, targetZ: 0, targetScale: 1, targetOpacity: 1 });
            }

            updateSphereTargets();
            snapSphereToTargets();
            applySpherePositions();

        function getSphereRingPosition(iconIndex, isOuter) {
            const count = isOuter ? outerIconCount : innerIconCount;
            const radius = isOuter ? outerRadius : innerRadius;
            const rotation = isOuter ? sphereOuterRotation : sphereInnerRotation;
            const localIndex = isOuter ? iconIndex : iconIndex - outerIconCount;
            const angle = (localIndex / count) * Math.PI * 2 + rotation;
            let x = Math.cos(angle) * radius;
            let z = Math.sin(angle) * radius;
            let y = 0;
            if (!isOuter) {
                const tiltRad = sphereInnerTiltX * Math.PI / 180;
                y = z * Math.sin(tiltRad);
                z = z * Math.cos(tiltRad);
            }
            const scale = 0.6 + (z + radius) / (radius * 2) * (isOuter ? 0.5 : 0.4);
            const opacity = 0.4 + (z + radius) / (radius * 2) * 0.5;
            return { x, y, z, scale, opacity };
        }

        function getSphereSpherePosition(iconIndex) {
            const count = sphereAllIcons.length;
            const radius = 180;
            const phi = Math.PI * (3 - Math.sqrt(5));
            const yNorm = 1 - (iconIndex / (count - 1)) * 2;
            const radiusAtY = Math.sqrt(1 - yNorm * yNorm);
            const theta = phi * iconIndex;

            let x = Math.cos(theta) * radiusAtY * radius;
            let z = Math.sin(theta) * radiusAtY * radius;
            let y = yNorm * radius;

            const cosY = Math.cos(sphereRotationY * Math.PI / 180);
            const sinY = Math.sin(sphereRotationY * Math.PI / 180);
            const rotatedX = x * cosY + z * sinY;
            const rotatedZ = -x * sinY + z * cosY;
            x = rotatedX;
            z = rotatedZ;

            const cosX = Math.cos(sphereRotationX * Math.PI / 180);
            const sinX = Math.sin(sphereRotationX * Math.PI / 180);
            const rotatedY = y * cosX - z * sinX;
            const rotatedZ2 = y * sinX + z * cosX;
            y = rotatedY;
            z = rotatedZ2;

            const scale = 0.6 + (z + radius) / (radius * 2) * 0.5;
            const opacity = 0.4 + (z + radius) / (radius * 2) * 0.5;
            return { x, y, z, scale, opacity };
        }

                if (sphereIsRingsMode) {
                    const isOuter = i < outerIconCount;
                    pos = getSphereRingPosition(i, isOuter);
                } else {
                    pos = getSphereSpherePosition(i);
                }
                state.targetX = pos.x; state.targetY = pos.y; state.targetZ = pos.z;
                state.targetScale = pos.scale; state.targetOpacity = pos.opacity;
            });
        }

        function applySpherePositions() {
            sphereAllIcons.forEach((icon, i) => {
                const state = sphereIconStates[i];

                icon.style.zIndex = Math.round(state.currentZ + 300);

        }

                state.currentScale = state.targetScale; state.currentOpacity = state.targetOpacity;

                sphereOuterRotation += autoRotateSpeed * 0.01;

                state.currentScale += (state.targetScale - state.currentScale) * 0.12;

            sphereAnimationId = requestAnimationFrame(animateSphere);

                cancelAnimationFrame(sphereAnimationId);

            if (!sphereIsDragging || e.touches.length !== 1) return;
            const deltaX = e.touches[0].clientX - spherePreviousMouseX;
            const deltaY = e.touches[0].clientY - spherePreviousMouseY;
            if (sphereIsRingsMode) {
                sphereVelocityOuter += deltaX * 0.002;
                sphereVelocityInner += deltaX * 0.002;
                sphereVelocityTiltX += deltaY * 0.15;
            } else {
                sphereRotationY += deltaX * 0.3;
                sphereRotationX += deltaY * 0.3;
            }
            spherePreviousMouseX = e.touches[0].clientX;
            spherePreviousMouseY = e.touches[0].clientY;
        }, { passive: true });

        document.addEventListener('touchend', () => { sphereIsDragging = false; });

        sphereModeBtn.addEventListener('click', () => {
            sphereIsRingsMode = false;
            sphereModeBtn.classList.add('active');
            ringsModeBtn.classList.remove('active');
        });

        ringsModeBtn.addEventListener('click', () => {
            sphereIsRingsMode = true;
            ringsModeBtn.classList.add('active');
            sphereModeBtn.classList.remove('active');
        });

        // ========== INTRO ANIMATION ==========
        const introOverlay = document.getElementById('introOverlay');
        setTimeout(() => { introOverlay.classList.add('hidden'); }, 3000);

        // ========== KEYBOARD EVENTS ==========
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (nuclearLightbox.classList.contains('active')) {
                    nuclearLightbox.classList.remove('active');
                } else if (isNuclearMode && !isTransitioning) {
                    exitNuclearMode();
                } else if (isBassvictimMode && !isTransitioning) {
                    exitBassvictimMode();
                } else if (isLuckiMode && !isTransitioning) {
                    exitLuckiMode();
                } else if (isGodraysMode && !isTransitioning && menuState !== 3) {
                    // Exit godrays from gradient bar mode
                    exitGodraysMode();
                } else if (isGodraysMode && menuState === 3) {
                    // Exit godrays from menu mode
                    closeGodraysView();
                    menuState = 0;
                } else if (isDarkMode && !isTransitioning) {
                    exitDarkMode();
                } else if (isGridMode && !isTransitioning) {
                    closeGridView();
                    menuState = 0;
                } else if (isSphereMode && !isTransitioning) {
                    closeSphereView();
                    menuState = 0;
                }
            }
        });
    </script>
</body>

</html>
